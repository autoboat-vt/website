name: Update external/cicd submodule

# Daily check for new commits on the upstream cicd repo
# (https://code.vt.edu/s4-hosting-sites/cicd). When main advances, open a
# PR bumping the submodule pointer and auto-merge it once CI passes.
#
# IMPORTANT: code.vt.edu requires VT InCommon Federation auth — it is NOT
# publicly accessible. This workflow needs a read-only VT GitLab personal
# access token stored as the GitHub secret `VT_GITLAB_TOKEN`.
#
# If the secret is not set, the workflow exits gracefully with a notice
# (no failure, no 403). To enable auto-update:
#   1. Create a PAT at https://code.vt.edu/-/profile/personal_access_tokens
#      with `read_repository` scope.
#   2. Add it as a repository secret named VT_GITLAB_TOKEN in
#      https://github.com/autoboat-vt/website/settings/secrets/actions
#
# For manual bumps (no token needed), run locally:
#   ./scripts/bump-cicd.sh

on:
    schedule:
        # 09:00 UTC daily. GitHub Actions cron is best-effort and may run late
        # during periods of high load; this is fine for a daily submodule bump.
        - cron: "0 9 * * *"
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: submodule-update
    cancel-in-progress: false

jobs:
    check-and-pr:
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Check for VT GitLab token
              id: check-token
              env:
                  VT_GITLAB_TOKEN: ${{ secrets.VT_GITLAB_TOKEN }}
              run: |
                  if [ -z "$VT_GITLAB_TOKEN" ]; then
                    echo "has_token=false" >> "$GITHUB_OUTPUT"
                    echo "::notice::No VT_GITLAB_TOKEN secret set. Skipping submodule update."
                    echo "::notice::To enable auto-update, create a read-only PAT at https://code.vt.edu/-/profile/personal_access_tokens (read_repository scope) and add it as repo secret VT_GITLAB_TOKEN. See scripts/bump-cicd.sh for manual bumps."
                  else
                    echo "has_token=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout repository
              if: steps.check-token.outputs.has_token == 'true'
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  # No submodules: we init external/cicd manually below with
                  # the token, since actions/checkout can't reach code.vt.edu.
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Configure git
              if: steps.check-token.outputs.has_token == 'true'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

            - name: Configure VT GitLab auth and init submodule
              if: steps.check-token.outputs.has_token == 'true'
              env:
                  VT_GITLAB_TOKEN: ${{ secrets.VT_GITLAB_TOKEN }}
              run: |
                  # Rewrite code.vt.edu HTTPS URLs to embed the token.
                  # The token is read-only (read_repository scope).
                  git config --global "url.https://oauth2:${VT_GITLAB_TOKEN}@code.vt.edu/.insteadOf" "https://code.vt.edu/"
                  git submodule update --init external/cicd

            - name: Fetch upstream cicd main
              if: steps.check-token.outputs.has_token == 'true'
              run: |
                  # The submodule's origin is the upstream cicd repo. Fetch
                  # its main branch and compare to the pinned pointer.
                  git -C external/cicd fetch origin main
                  upstream_sha="$(git -C external/cicd rev-parse origin/main)"
                  current_sha="$(git submodule status external/cicd | awk '{print $1}' | sed 's/^[-+]//')"
                  echo "current=$current_sha"
                  echo "upstream=$upstream_sha"
                  echo "upstream_sha=$upstream_sha" >> "$GITHUB_ENV"
                  echo "current_sha=$current_sha" >> "$GITHUB_ENV"

            - name: Bump submodule pointer if behind
              if: steps.check-token.outputs.has_token == 'true'
              id: bump
              run: |
                  if [ "$current_sha" = "$upstream_sha" ]; then
                    echo "Up to date: external/cicd at $current_sha"
                    echo "changed=false" >> "$GITHUB_OUTPUT"
                  else
                    git -C external/cicd checkout "$upstream_sha"
                    git add external/cicd
                    git commit -m "chore(submodule): bump external/cicd to ${upstream_sha:0:12}

                    Upstream: https://code.vt.edu/s4-hosting-sites/cicd
                    $current_sha → $upstream_sha"
                    echo "changed=true" >> "$GITHUB_OUTPUT"
                  fi

            - name: Build short log for PR body
              if: steps.check-token.outputs.has_token == 'true' && steps.bump.outputs.changed == 'true'
              run: |
                  {
                    echo 'log<<EOF'
                    git -C external/cicd log --oneline --no-decorate "$current_sha..$upstream_sha" | head -40
                    echo 'EOF'
                  } >> "$GITHUB_ENV"

            - name: Create / update PR
              if: steps.check-token.outputs.has_token == 'true' && steps.bump.outputs.changed == 'true'
              id: pr
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}
                  branch: chore/bump-external-cicd
                  commit-message: "chore(submodule): bump external/cicd to ${upstream_sha:0:12}"
                  title: "chore(submodule): bump external/cicd to ${upstream_sha:0:12}"
                  body: |
                      Automated daily check found new commits on the upstream `cicd` repo's
                      `main` branch.

                      - Upstream: https://code.vt.edu/s4-hosting-sites/cicd
                      - `${current_sha}` → `${upstream_sha}`

                      Upstream log (newest first):

                      ```
                      ${log}
                      ```

                      This PR was opened by the `submodule-update.yml` workflow. It will be
                      auto-merged once CI passes.
                  labels: submodule, automated
                  delete-branch: true

            - name: Enable auto-merge
              if: steps.check-token.outputs.has_token == 'true' && steps.bump.outputs.changed == 'true' && steps.pr.outputs.pull-request-number
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  pr_number="${{ steps.pr.outputs.pull-request-number }}"
                  # Requires "Allow auto-merge" enabled in repo settings.
                  gh pr merge "$pr_number" --auto --squash --delete-branch \
                    || echo "::warning::Auto-merge could not be enabled (is 'Allow auto-merge' on in repo settings?). PR #$pr_number left open for manual review."
