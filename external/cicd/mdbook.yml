build:
  script:
    - wget https://github.com/rust-lang/mdBook/releases/download/v0.5.0/mdbook-v0.5.0-x86_64-unknown-linux-gnu.tar.gz
    - tar xvzf mdbook-v0.5.0-x86_64-unknown-linux-gnu.tar.gz
    - mdbook clean
    - mdbook build
  artifacts:
    paths:
      - public

deploy:
  image: akulavishal/terraform:awscli
  stage: deploy
  script:
    - aws s3 sync . s3://$S3_BUCKET_NAME  --delete --exclude ".*" --exclude ".*/*" --exclude "*/.DAV/*" 
    - aws cloudfront create-invalidation --distribution-id=$DISTRIBUTION_ID --paths "/" "/*"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
