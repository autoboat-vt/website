stages: 
    - deploy
    - accessibility
    
variables:
  a11y_urls: "https://joyhosting.s4.dvlp.es.cloud.vt.edu/before.html https://joyhosting.s4.dvlp.es.cloud.vt.edu/"

include:
  - template: "Verify/Accessibility.gitlab-ci.yml"

deploy:
    image: akulavishal/terraform:awscli
    stage: deploy
    script:
    - aws s3 sync . s3://$S3_BUCKET_NAME  --delete --exclude ".*" --exclude ".*/*" --exclude "*/.DAV/*" 
    - aws cloudfront create-invalidation --distribution-id=$DISTRIBUTION_ID --paths "/" "/*"
    rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
