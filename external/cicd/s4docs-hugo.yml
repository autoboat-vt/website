image: registry.gitlab.com/pages/hugo/hugo_extended:latest


variables:
  HUGO_ENV: production
  THEME_URL: "github.com/google/docsy@v0.10.0"

buildHugo:
  before_script:
    - apk add --no-cache go curl bash npm
    - hugo mod get -u $THEME_URL
    # To use PostCSS, we must install the following modules. See:
    # - https://gohugo.io/hugo-pipes/postcss/
    # - https://github.com/google/docsy/tree/main#prerequisites
    - npm install postcss postcss-cli autoprefixer
    
  script:
    - hugo --minify
  artifacts:
    paths:
      - public
  rules:
    - if: $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH

deploy:
    image: akulavishal/terraform:awscli
    stage: deploy
    dependencies:
      - buildHugo
    script:
      - aws s3 sync ./public/ s3://$S3_BUCKET_NAME --delete --exclude ".*" --exclude ".*/*" --exclude "*/.DAV/*" 
      #- aws cloudfront create-invalidation --distribution-id=$DISTRIBUTION_ID --paths "/" "/*"
    rules:
      - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
